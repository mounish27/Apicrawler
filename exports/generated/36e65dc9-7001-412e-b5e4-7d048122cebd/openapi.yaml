          application/json:
            example:
              ClockTransferCode: string
              IsDeleted: true
              LaborMetricTypeXRefCode: string
              LongName: string
              ShortName: string
            schema: {}
        required: false
      responses:
        '200':
          description: OK
      summary: PATCH Labor Metric Types
