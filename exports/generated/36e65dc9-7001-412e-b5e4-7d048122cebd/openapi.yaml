components:
  securitySchemes:
    oauth2:
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: https://auth.example.com/token
      type: oauth2
info:
  description: ''
  title: RESTful Add and Update Org Units
  version: 1.0.0
openapi: 3.1.0
paths:
  /V1/BackgroundScreening:
    patch:
      description: Patch Candidate Background Screening to Dayforce . Candidate Background
        Screening enables the provider to update the background screening status,
        URL, Report containing Personal Identifiable Information (PII) to Dayforce
        .
      parameters:
      - description: String
        in: query
        name: ScreeningRequestId*
        required: false
        schema:
          type: n/a
      - description: String
        in: query
        name: URL
        required: false
        schema:
          type: n/a
      - description: String
        in: query
        name: ScreeningStatus
        required: false
        schema:
          type: screening status object
      - description: Candidate background screening adjudication status
        in: query
        name: AdjudicationStatus
        required: false
        schema:
          type: string
      - description: String
        in: query
        name: CandidatePII
        required: false
        schema:
          type: candidate pii object
      - description: Candidate Social Security number
        in: query
        name: SocialSecurityNumber
        required: false
        schema:
          type: string
      - description: Candidate Social Insurance number
        in: query
        name: SocialInsuranceNumber
        required: false
        schema:
          type: string
      - description: Candidate driver license
        in: query
        name: DriverLicense
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: PATCH Candidate Background Screening
      tags:
      - dayforce
    post:
      description: POST Background Screening Provider Statuses endpoint enables the
        provider to send background screening statuses  to Dayforce .
      parameters:
      - description: Provider unique identifier
        in: query
        name: ProviderReference
        required: false
        schema:
          type: string
      - description: List of strings of the screening order statuses
        in: query
        name: OrderStatuses
        required: false
        schema:
          type: list of strings
      - description: List of strings of the screening adjudication statuses
        in: query
        name: AdjudicationStatuses
        required: false
        schema:
          type: list of strings
      - description: List of strings of the screening result statuses
        in: query
        name: ResultStatuses
        required: false
        schema:
          type: list of strings
      responses:
        '200':
          content:
            application/json:
              example:
                AdjudicationStatuses:
                - Adjudication Status 1
                - Adjudication Status 2
                OrderStatuses:
                - Order Status 1
                - Order Status 2
                ProviderReference: BS_GENERIC
                ResultStatuses:
                - Result Status 1
                - Result Status 2
          description: OK
      summary: POST Background Screening Provider Statuses
      tags:
      - dayforce
  /V1/BackgroundScreening/AdjudicationStatus:
    patch:
      description: Patch Candidate Background Screening Adjudication Status to Dayforce
        . Candidate Background Screening Adjudication Status is displayed on the candidate
        grid as part of the Screening Order Field. It is displayed side by side with
        the Background Screening Status.
      parameters:
      - description: Dayforcecandidate background screening reference
        in: query
        name: ScreeningRequestId*
        required: false
        schema:
          type: string
      - description: Candidate background screening adjudication status
        in: query
        name: AdjudicationStatus*
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: PATCH Candidate Background Screening Adjudication Status
      tags:
      - dayforce
  /V1/BackgroundScreening/BillingCode:
    post:
      description: POST Background Screening Billing Codes endpoint enables the provider
        to send a list of Billing Codes to Dayforce . The provider can also send the
        list of associated packages (if any) together.
      parameters:
      - description: Provider Unique Identifier.
        in: query
        name: ProviderReference*
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: POST Background Screening Billing Codes
      tags:
      - dayforce
  /V1/BackgroundScreening/CandidateRightToWorkResults:
    patch:
      description: Patch Candidate Background Screening Right to Work to Dayforce
        . Candidate work rights status  is displayed on the candidate grid in the
        Indicators field.
      parameters:
      - description: Dayforcecandidate background screening reference ID
        in: query
        name: ScreeningRequestId*
        required: false
        schema:
          type: n/a
      - description: The candidate right to work results. See next table for parameters.
        in: query
        name: CandidateRightToWorkResults
        required: false
        schema:
          type: see next table
      responses:
        '200':
          description: OK
      summary: PATCH Candidate Background Screening Right to Work
      tags:
      - dayforce
  /V1/BackgroundScreening/Package:
    post:
      description: POST Background Screening Packages endpoint enables the provider
        to send a list of packages to Dayforce . The provider can also send the list
        of associated billing codes (if any) together.
      parameters:
      - description: Provider unique identifier
        in: query
        name: ProviderReference*
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: POST Background Screening Packages
      tags:
      - dayforce
  /V1/BackgroundScreening/PersonalIdentifiableInformation:
    patch:
      description: Patch Candidate Background Screening Personal Identifiable Information
        (PII) to Dayforce . It enables the provider to update the candidate PII to
        Dayforce .
      parameters:
      - description: String
        in: query
        name: ScreeningRequestId*
        required: false
        schema:
          type: n/a
      - description: String
        in: query
        name: CandidatePII*
        required: false
        schema:
          type: candidatepii object
      - description: Candidate Social Security number.
        in: query
        name: SocialSecurityNumber
        required: false
        schema:
          type: string
      - description: Candidate Social Insurance Number.
        in: query
        name: SocialInsuranceNumber
        required: false
        schema:
          type: string
      - description: Candidate driver license.
        in: query
        name: DriverLicense
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: PATCH Candidate Background Screening Personal Identifiable Information
      tags:
      - dayforce
  /V1/BackgroundScreening/Status:
    patch:
      description: Patch Candidate Background Screening Status to Dayforce . Candidate
        Background Screening Status is displayed on the candidate grid as part of
        the Screening Order Field.
      parameters:
      - description: Dayforcecandidate background screening reference
        in: query
        name: ScreeningRequestId*
        required: false
        schema:
          type: string
      - description: Candidate background screening order status
        in: query
        name: ScreeningStatus*
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: PATCH Candidate Background Screening Status
      tags:
      - dayforce
  /V1/ClientMetadata:
    get:
      description: Dayforce hosts multiple versions of this service to support multiple
        clients. All clients use the same URL, and Dayforce issues an HTTP redirect
        on every request to ensure that your request is processed with the correct
        service.
      responses:
        '200':
          description: OK
      summary: Determine Which URL to Use
      tags:
      - dayforce
  /V1/ContactInformationTypes:
    get:
      description: 'The following requests allow the consuming application to retrieve
        a list of  XRefCodes for HR Admin subfeatures:'
      responses:
        '200':
          description: OK
      summary: RESTful Get HR Admin XRefCodes
      tags:
      - dayforce
  /V1/Departments:
    get:
      description: The GET Departments XRefCodes request allows the consuming application
        to retrieve a list of  XRefCodes for departments. This request returns only
        a list of XRefCodes and is the first step in a two-step process that includes
        a GET Departments By XRefCodes request. See RESTful Get Department Details
        .
      responses:
        '200':
          description: OK
      summary: RESTful Get Department XRefCodes
      tags:
      - dayforce
    patch:
      description: Dayforce RESTful services use the PATCH verb to update departments.
      responses:
        '200':
          description: OK
      summary: PATCH Department Data
      tags:
      - dayforce
    post:
      description: Dayforce RESTful services use the POST verb to create a department.
      responses:
        '200':
          description: OK
      summary: POST Department Data
      tags:
      - dayforce
  /V1/EmployeeBalancePeriods:
    get:
      description: This request is used to get a list of an employee's entitlement
        balances.
      responses:
        '200':
          content:
            application/json:
              example:
                Data:
                - BalanceName: string
                  BalanceXRefCode: string
                  CurrentAccruedValue: 0
                  CurrentGrantValue: 0
                  EffectiveEnd: '2021-03-09T19:31:05.537Z'
                  EffectiveStart: '2021-03-09T19:31:05.537Z'
                  EmployeeXRefCode: string
                  InitialAccruedValue: 0
                  InitialGrantValue: 0
                  MaximumValue: 0
                  MinimumValue: 0
                ProcessResults:
                - Code: string
                  Context: string
                  Level: string
                  Message: string
          description: OK
      summary: Get Employee Balance Periods
      tags:
      - dayforce
  /V1/EmployeeBalanceTransactions:
    get:
      description: Balance transactions represent instances when employees earned
        and used their balances (for example, balances used by time away from work
        or incremented by entitlement policies).
      responses:
        '200':
          content:
            application/json:
              example:
                Data:
                - EffectiveEnd: '2021-02-22T17:35:50.688Z'
                  EffectiveStart: '2021-02-22T17:35:50.688Z'
                  EmployeeBalancePeriodIdExternal: 0
                  Transactions:
                  - ApprovalStatus: string
                    Comment: string
                    Delta: 0
                    ExpiryDate: '2021-02-22T17:35:50.689Z'
                    GrantDelta: 0
                    TAFWXRefCode: string
                    TransactionDate: '2021-02-22T17:35:50.689Z'
                    TransactionSource: 0
                ProcessResults:
                - Code: string
                  Context: string
                  Level: string
                  Message: string
          description: OK
      summary: Get Employee Balance Transactions
      tags:
      - dayforce
    patch:
      description: Dayforce RESTful services use the PATCH verb to update employee
        balance transactions.
      responses:
        '200':
          description: OK
      summary: PATCH Employee Balance Transactions
      tags:
      - dayforce
    post:
      description: Dayforce RESTful services use the POST verb to create an employee
        balance transaction.
      responses:
        '200':
          description: OK
      summary: POST Employee Balance Transactions
      tags:
      - dayforce
  /V1/EmployeePayAdjustments:
    patch:
      description: Dayforce RESTful services use the PATCH verb to update employee
