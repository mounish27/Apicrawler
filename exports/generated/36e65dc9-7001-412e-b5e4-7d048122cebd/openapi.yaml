                  DocketXRefCode: string
                  EmployeeXRefCode: string
                  IsPremium: true
                  JobXRefCode: string
                  LaborMetricsCode0XRefCode: string
                  LaborMetricsCode1XRefCode: string
                  LaborMetricsCode2XRefCode: string
                  LaborMetricsCode3XRefCode: string
                  LaborMetricsCode4XRefCode: string
                  LaborMetricsCode5XRefCode: string
                  LaborMetricsCode6XRefCode: string
                  LaborMetricsCode7XRefCode: string
                  LaborMetricsCode8XRefCode: string
                  LaborMetricsCode9XRefCode: string
                  LocationXRefCode: string
                  MinuteDuration: 0
                  NetHours: 0
                  PayAmount: 0
                  PayCategoryXRefCode: string
                  PayCodeXRefCode: string
                  PayDate: '2020-07-20T15:44:51.720Z'
                  PieceQuantity: 0
                  PositionXRefCode: string
                  ProjectXRefCode: string
                  PunchSegmentStart: '2020-07-20T15:44:51.720Z'
                  Rate: 0
                  TimeEnd: '2020-07-20T15:44:51.720Z'
                  TimeStart: '2020-07-20T15:44:51.720Z'
                Paging:
                  Next: string
                ProcessResults:
                - Code: string
                  Context: string
                  Level: string
                  Message: string
          description: OK
      summary: RESTful Get Employee Pay Summaries
      tags:
      - dayforce
  /V1/EmployeePunches:
    post:
      description: 'This POST operation adds an employee time entry. The operation
        uses the following URL:'
      parameters:
      - in: query
        name: isValidateOnly
        required: false
        schema:
          type: this parameter is used to specify that all of the validations need
            to be performed without committing any changes. use this parameter to
            control whether committing information in yourdayforceinstance is your
            responsibility.the url syntax is:https://www.dayforcehcm.com/api/companyname/v1/employeepunches?isvalidateonly=true
      responses:
        '200':
          description: OK
      summary: POST Employee Punches
      tags:
      - dayforce
  /V1/EmployeePunches/{xRefCode}:
    patch:
      description: 'This PATCH operation updates an employee time entry. The operation
        uses the following URL:'
      parameters:
      - in: query
        name: xRefCode
        required: false
        schema:
          type: the xrefcode of the time entry that you want to update.
      - in: query
        name: isValidateOnly
        required: false
        schema:
          type: this parameter is used to specify that all of the validations need
            to be performed without committing any changes. use this parameter to
            control whether committing information in yourdayforceinstance is your
            responsibility.the url syntax is:https://www.dayforcehcm.com/api/companyname/v1/employeepunches/{xrefcode}?isvalidateonly=true
      responses:
        '200':
          description: OK
      summary: PATCH Employee Punches
      tags:
      - dayforce
  /V1/EmployeeSchedules:
    patch:
      description: Dayforce RESTful services use the PATCH endpoint to create an instance
        of the resource.  In the case of the Employee Schedules resource, PATCH  refers
        to creating new shifts.
      requestBody:
        content:
          application/json:
            example:
            - Activities:
              - TimeEnd: '2023-10-18T16:15:16.446Z'
                TimeStart: '2023-10-18T16:15:16.446Z'
                XRefCode: string
              Breaks:
              - TimeEnd: '2023-10-18T16:15:16.446Z'
                TimeStart: '2023-10-18T16:15:16.446Z'
                Type: 1
              Comment: string
              DocketXRefCode: string
              EmployeeScheduleXRefCode: string
              EmployeeXRefCode: string
              IsDeleted: true
              LaborMetrics:
              - CodeXRefCode: string
                TypeXRefCode: string
              OrgLocationTypeXRefCode: string
              PayAdjCodeXRefCode: string
              PositionXRefCode: string
              PostShiftBid: true
              ProjectXRefCode: string
              Segments:
              - Comment: string
                DocketXRefCode: string
                LaborMetrics:
                - CodeXRefCode: string
                  TypeXRefCode: string
                OrgLocationTypeXRefCode: string
                PayAdjCodeXRefCode: string
                PositionXRefCode: string
                ProjectXRefCode: string
                TimeEnd: '2023-10-18T16:15:16.446Z'
                TimeStart: '2023-10-18T16:15:16.446Z'
              TimeEnd: '2023-10-18T16:15:16.446Z'
              TimeStart: '2023-10-18T16:15:16.446Z'
            schema: {}
        required: false
      responses:
        '200':
          description: OK
      summary: PATCH Employee Schedules
      tags:
      - dayforce
    post:
      description: Dayforce RESTful services use the POST endpoint to create an instance
        of the resource.  In the case of the EmployeeSchedules resource, POST refers
        to creating a new employee schedule.
      responses:
        '200':
          description: OK
      summary: POST Employee Schedules
      tags:
      - dayforce
  /V1/Employees:
    post:
      description: 'You can use the POST and PATCH HTTP verbs to add and update employee
        HR data in Dayforce . There are a number of subordinate resources that you
        can use to insert and update employee HR data in Dayforce . The URL for the
        subordinate calls is constructed as follows:'
      responses:
        '200':
          description: OK
      summary: POST and PATCH Employee Subordinate Resources
      tags:
      - dayforce
  /V1/JobFeeds:
    get:
      description: Get Job Postings is used to share career site postings in Dayforce
        with external job boards. Job board providers use this endpoint to obtain
        job posting data.
      responses:
        '200':
          content:
            application/json:
              example:
              - ApplyUrl: https://prdemo.dayforcehcm.com/CandidatePortal/en-US/prdemo2/JobPosting/Job?jobId=17
                City: San Francisco
                ClientSiteName: Client Careers Site
                ClientSiteXrefCode: CANDIDATEPORTAL
                CompanyName: XYZ Co.
                Country: USA
                CultureCode: en-US
                DatePosted: '2014-06-13T00:00:00'
                Description: Sample desc
                Education: Master’s Degree
                EmploymentIndicator: Contractor
                HiringRate: 10.3
                JobDetailsUrl: http://localhost:51009/en-US/DFLocal/Posting/View/17
                JobFunction: General and Operations Manager
                JobType: 0
                LastUpdated: '2014-06-13T17:06:44.16'
                ParentCompanyName: XYZ Co.
                ParentRequisitionCode: 3
                PostalCode: '30009'
                ReferenceNumber: 17
                State: CA
                TelecommutePercentage: 10
                Title: Store 110 - Accessories Associate
                TravelPercentage: 30
                TravelRequired: 1
          description: OK
      summary: RESTful Get Job Postings
      tags:
      - dayforce
  /V1/Jobs:
    get:
      description: The GET Jobs XRefCodes request allows the consuming application
        to retrieve a list of  XRefCodes for jobs. This request returns only a list
        of XRefCodes and is the first step in a two-step process that includes a GET
        Jobs By XRefCodes request. See RESTful Get Job Details .
      responses:
        '200':
          description: OK
      summary: RESTful Get Job XRefCodes
      tags:
      - dayforce
    patch:
      description: Dayforce RESTful services use the PATCH verb to update jobs.
      responses:
        '200':
          description: OK
      summary: PATCH Job Data
      tags:
      - dayforce
    post:
      description: Dayforce RESTful services use the POST verb to create a job.
      responses:
        '200':
          description: OK
      summary: POST Job Data
      tags:
      - dayforce
  /V1/LaborMetricTypes:
    patch:
      description: Dayforce RESTful services use the PATCH verb to update labor metric
